name: Update project data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/update-projects.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site
        uses: actions/checkout@v7

      - name: Generate projects.json only when project data changed
        id: generate
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            const owner = "ferino75";
            const repos = [
              "plg_content_fgautolightbox",
              "pkg_fgbackendlangswitcher",
              "plg_system_fgadminlogincustom",
              "plg_system_fgofflineipwhitelist",
              "plg_system_fgemailremover",
              "plg_system_fgstripcomments"
            ];

            const projects = {};

            for (const repo of repos) {
              const { data } = await github.rest.repos.get({ owner, repo });

              let releaseTag = null;
              let releaseHtmlUrl = null;
              let releaseZipUrl = null;
              let downloadCount = 0;

              try {
                const release = await github.rest.repos.getLatestRelease({ owner, repo });
                releaseTag = release.data.tag_name || null;
                releaseHtmlUrl = release.data.html_url || null;
                releaseZipUrl = release.data.zipball_url || null;
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              // Sum all attached release asset downloads across the repository.
              // GitHub-generated "Source code (zip/tar.gz)" archives are not assets
              // and therefore are not included in this metric.
              const releases = await github.paginate(
                github.rest.repos.listReleases,
                { owner, repo, per_page: 100 }
              );

              for (const release of releases) {
                for (const asset of release.assets || []) {
                  downloadCount += asset.download_count || 0;
                }
              }

              projects[repo] = {
                html_url: data.html_url,
                stargazers_count: data.stargazers_count,
                updated_at: data.updated_at,
                language: data.language,
                release_tag: releaseTag,
                release_html_url: releaseHtmlUrl,
                release_zip_url: releaseZipUrl,
                download_count: downloadCount
              };
            }

            let previousProjects = null;

            if (fs.existsSync("projects.json")) {
              try {
                const previous = JSON.parse(fs.readFileSync("projects.json", "utf8"));
                previousProjects = previous.projects || null;
              } catch {
                previousProjects = null;
              }
            }

            const currentComparable = JSON.stringify(projects);
            const previousComparable = JSON.stringify(previousProjects);

            if (currentComparable === previousComparable) {
              core.info("Project metadata did not change; projects.json remains untouched.");
              core.setOutput("changed", "false");
              return;
            }

            const output = {
              _meta: {
                generated_at: new Date().toISOString()
              },
              projects
            };

            fs.writeFileSync(
              "projects.json",
              JSON.stringify(output, null, 2) + "\n",
              "utf8"
            );

            core.setOutput("changed", "true");

      - name: Commit updated data
        if: steps.generate.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add projects.json
          git commit -m "Update project data"
          git push
