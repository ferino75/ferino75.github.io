name: Update project data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [master]
    paths:
      - ".github/workflows/update-projects.yml"
      - "projects.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v7

      - name: Update project metadata
        id: generate
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const owner = "ferino75";
            const file = "projects.json";
            const document = JSON.parse(fs.readFileSync(file, "utf8"));
            const configured = document.projects || {};
            const repos = Object.keys(configured);

            const dynamicKeys = new Set([
              "html_url","stargazers_count","updated_at","pushed_at","language",
              "release_tag","release_html_url","release_zip_url","download_count"
            ]);

            const staticOnly = project => Object.fromEntries(
              Object.entries(project).filter(([key]) => !dynamicKeys.has(key))
            );

            const projects = {};

            for (const repo of repos) {
              const staticConfig = staticOnly(configured[repo]);
              const { data } = await github.rest.repos.get({ owner, repo });

              let releaseTag = null;
              let releaseHtmlUrl = null;
              let releaseZipUrl = null;
              let downloadCount = 0;

              try {
                const release = await github.rest.repos.getLatestRelease({ owner, repo });
                releaseTag = release.data.tag_name || null;
                releaseHtmlUrl = release.data.html_url || null;
                releaseZipUrl = release.data.zipball_url || null;
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              const releases = await github.paginate(
                github.rest.repos.listReleases,
                { owner, repo, per_page: 100 }
              );

              for (const release of releases) {
                for (const asset of release.assets || []) {
                  downloadCount += asset.download_count || 0;
                }
              }

              projects[repo] = {
                ...staticConfig,
                html_url: data.html_url,
                stargazers_count: data.stargazers_count,
                updated_at: data.updated_at,
                pushed_at: data.pushed_at,
                language: data.language,
                release_tag: releaseTag,
                release_html_url: releaseHtmlUrl,
                release_zip_url: releaseZipUrl,
                download_count: downloadCount
              };
            }

            if (JSON.stringify(configured) === JSON.stringify(projects)) {
              core.info("Project data did not change.");
              core.setOutput("changed", "false");
              return;
            }

            fs.writeFileSync(file, JSON.stringify({
              _meta: {...document._meta, generated_at: new Date().toISOString()},
              projects
            }, null, 2) + "\n");

            core.setOutput("changed", "true");

      - name: Commit updated data
        if: steps.generate.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git commit -m "Update project data"
          git push
